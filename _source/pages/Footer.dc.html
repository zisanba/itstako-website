<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="width:100%;background:#FAF9FD">
<div style="max-width:1296px;margin:0 auto;padding:0 24px 24px;box-sizing:border-box">
<div style="background:#2A2968;border-radius:40px;padding:56px;box-sizing:border-box;font-family:'DM Sans',sans-serif;color:#fff">
<div style="display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between">
<div style="flex:1 1 300px;display:flex;flex-direction:column;gap:18px"><div style="display:flex;align-items:center;gap:10px"><svg width="46" height="39" viewBox="250 195 745 630" aria-hidden="true" style="flex:none"><defs><clipPath id="fm"><polygon points="729,190 1000,190 1000,460 482,460"/></clipPath></defs><rect x="255" y="200" width="465" height="255" rx="127" fill="#C8BDEB"/><rect x="465" y="330" width="245" height="490" rx="122" fill="#FF3D58"/><g clip-path="url(#fm)"><rect x="480" y="200" width="510" height="250" rx="125" fill="#FF3D58"/></g><path d="M467 520C470 480 520 456 575 455L708 455C600 500 500 560 468 640Z" fill="#C21F4C" opacity=".8"/></svg><div style="display:flex;flex-direction:column;line-height:1"><span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.04em;color:#fff">tako</span><span style="font-family:'DM Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.3em;color:#C8BDEB;padding-top:3px">BY TECHNE</span></div></div>
<div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:20px;line-height:1.3;color:#fff;max-width:280px">{{tag}}</div>
<div style="font-size:15px;color:#C8BDEB">{{pow}}</div></div>
<div style="display:flex;flex-wrap:wrap;gap:56px">
<div style="display:flex;flex-direction:column;gap:12px"><div style="font-weight:600;font-size:12px;letter-spacing:.2em;color:#fff">{{hProd}}</div>
<a href="{{features}}" style="color:#C8BDEB;font-family:'DM Sans',sans-serif;font-size:15px">{{tFeatures}}</a><a href="{{pricing}}" style="color:#C8BDEB;font-family:'DM Sans',sans-serif;font-size:15px">{{tPricing}}</a><a href="{{demo}}" style="color:#C8BDEB;font-family:'DM Sans',sans-serif;font-size:15px">{{tDemo}}</a></div>
<div style="display:flex;flex-direction:column;gap:12px"><div style="font-weight:600;font-size:12px;letter-spacing:.2em;color:#fff">{{hLegal}}</div>
<a href="#" style="color:#C8BDEB;font-family:'DM Sans',sans-serif;font-size:15px">{{tPriv}}</a><a href="#" style="color:#C8BDEB;font-family:'DM Sans',sans-serif;font-size:15px">{{tTerms}}</a><a href="#" style="color:#C8BDEB;font-family:'DM Sans',sans-serif;font-size:15px">{{tCook}}</a></div></div></div>
<div style="margin-top:44px;padding-top:24px;border-top:1px solid #4B4A86;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:#C8BDEB"><span>{{copy}}</span><span>itstako.com</span></div>
</div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":null},"$preview":{"width":1360,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const lang = String(this.props.lang || 'en').toLowerCase();
    const tr = lang === 'tr';
    const f = (p) => './' + p + '-' + lang.toUpperCase() + '.dc.html';
    return {
      features: f('Features'), pricing: f('Pricing'), demo: f('Demo'),
      tFeatures: tr ? 'Özellikler' : 'Features', tPricing: tr ? 'Fiyatlandırma' : 'Pricing', tDemo: 'Demo',
      hProd: tr ? 'ÜRÜN' : 'PRODUCT', hLegal: tr ? 'YASAL' : 'LEGAL',
      tPriv: tr ? 'Gizlilik Politikası' : 'Privacy Policy', tTerms: tr ? 'Kullanım Koşulları' : 'Terms of Use', tCook: tr ? 'Çerez Politikası' : 'Cookie Policy',
      tag: tr ? 'Modern ticaret için geliştirildi.' : 'Built for modern commerce.',
      pow: tr ? 'Techne tarafından desteklenir.' : 'Powered by Techne.',
      copy: tr ? '© 2026 Techne. Tüm hakları saklıdır.' : '© 2026 Techne. All rights reserved.'
    };
  }
}
</script>
</body>
</html>
